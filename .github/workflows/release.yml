name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check release version
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"
      # Tests are the local gate: even the fast tier drives real tmux panes and
      # a pi binary, which a runner does not have. Run npm run test before
      # tagging. CI re-checks what needs no agent environment.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
