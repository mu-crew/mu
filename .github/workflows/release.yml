name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read # the Test run of the tagged commit
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v5
      - name: Check release version
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"
      # The gate is the Test workflow (.github/workflows/test.yml) on THIS commit:
      # push the release commit to a ci/** branch and wait for it to go green
      # before tagging (RELEASING.md). No green run, no release.
      - name: Test workflow green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          if [ "$green" = "0" ]; then
            echo "::error::no successful Test run for $GITHUB_SHA: push it to a ci/** branch and wait for green (RELEASING.md)"
            exit 1
          fi
          echo "Test workflow green for $GITHUB_SHA ($green run(s))"
      # The notes fail here when the [x.y.z] section is missing or over GitHub's
      # 125000-character body limit. A re-run edits the existing release.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog-section.py CHANGELOG.md "$version" > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "mu $version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "mu $version" --notes-file notes.md --verify-tag
          fi
      # npm publish is manual for now (RELEASING.md): trusted publishing has failed
      # with ENEEDAUTH on every release since the repo moved to mu-crew/mu.
